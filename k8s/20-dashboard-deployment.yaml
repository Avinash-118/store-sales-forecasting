apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: storesales-m5
  labels: { app: dashboard }
spec:
  replicas: 2
  selector:
    matchLabels: { app: dashboard }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        app: dashboard
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: store-app
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: dashboard }
      containers:
        - name: dashboard
          image: avinashstoresalesacr.azurecr.io/store-sales-forecasting-api:v6
          command: ["streamlit", "run", "dashboard.py",
                    "--server.address=0.0.0.0", "--server.port=8501",
                    "--server.headless=true"]
          ports:
            - containerPort: 8501
          envFrom:
            - configMapRef: { name: store-config }
          resources:
            requests: { cpu: "100m", memory: "384Mi" }
            limits:   { cpu: "500m", memory: "1Gi" }
          startupProbe:
            httpGet: { path: /_stcore/health, port: 8501 }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /_stcore/health, port: 8501 }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /_stcore/health, port: 8501 }
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            preStop:
              exec: { command: ["sleep", "10"] }
