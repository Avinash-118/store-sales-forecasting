# Never let voluntary disruptions (node drain, upgrade, scale-down) take every replica at once.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: storesales-m5
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: api }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dashboard
  namespace: storesales-m5
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: dashboard }
