# Lets pods act as the M4 managed identity (store-app-identity) via AKS workload identity.
# That identity already has Key Vault get/list, Storage Blob Data Contributor and AcrPull.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: store-app
  namespace: storesales-m5
  annotations:
    azure.workload.identity/client-id: "73e2c04d-fb50-439e-a9b0-dc1eec246d73"
