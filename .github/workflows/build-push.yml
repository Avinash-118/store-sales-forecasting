name: build-push
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: avinashstoresalesacr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - run: docker build -t avinashstoresalesacr.azurecr.io/store-sales-forecasting-api:v2 .
      - run: docker push avinashstoresalesacr.azurecr.io/store-sales-forecasting-api:v2
